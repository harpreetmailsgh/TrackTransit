<script type="text/javascript">
    var currentImg = "bus";
    var lang = ''.substring(0, 2);

    function getCurrentTime() {
        var currentTime = new Date();
        var hours = currentTime.getHours();
        var minutes = currentTime.getMinutes();
        if (minutes < 10) {
            minutes = "0" + minutes;
        }
        var rtn = hours + ":" + minutes;
        return rtn;
    }

    function getCurrentDate() {
        var currentDate = new Date();
        var mth = currentDate.getMonth();
        var day = currentDate.getDate();
        var monthsFr = ["janv", "févr", "mars", "avril", "mai", "juin", "juil", "août", "sept", "oct", "nov", "déc"];
        var formattedDate = currentDate.format("MMM dd");
        
        if (lang == 'fr'){
            formattedDate = day + ' ' + monthsFr[mth];
        }
        return formattedDate;
    }

    function getCurrentDateLabel() {
        return getCurrentWeekday() + '&nbsp;' + getCurrentDate();
    }

    function getCurrentDateLabel2() {
        return getCurrentDate() + '&nbsp;' + getCurrentWeekday();
    }

    function getCurrentWeekday() {
        var currentDate = new Date();
        var iWkDay = currentDate.getDay();
        var wkDay = 'WEEKDAY';
        var wkDayList = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        var wkDayfr = ['DIM', 'LUN', 'MAR', 'MER', 'JEU', 'VAN', 'SAM'];

        if (lang == 'fr') {
            wkDayList = wkDayfr;
        }

        wkDay = wkDayList[iWkDay];
        return wkDay;
    }

    function ChangeCursor(tableRow) {
        tableRow.style.cursor = 'pointer';
    }

    function BlockUI() {
        $.blockUI({
            message: $('#wait'),
            css: {
                top: ($(window).height() - 200) / 2 + 'px',
                left: ($(window).width() - 200) / 2 + 'px',
                width: '200px',
                height: '200px'
            }
        });
    }

    function UnBlockUI() {
        $.unblockUI();
    }

    function setCookie(c_name, value, exdays) {
        var exdate = new Date();
        exdate.setDate(exdate.getDate() + exdays);
        var c_value = escape(value) + ((exdays == null) ? "" : "; expires=" + exdate.toUTCString());
        document.cookie = c_name + "=" + c_value;
    }

    function getCookie(c_name) {
        var i, x, y, ARRcookies = document.cookie.split(";");
        for (i = 0; i < ARRcookies.length; i++) {
            var idx = $.inArray('=', ARRcookies[i]);
            if (idx > 0) {
                x = ARRcookies[i].substr(0, idx);
                y = ARRcookies[i].substr(idx + 1);
                x = x.replace(/^\s+|\s+$/g, "");
            }
            if (x == c_name) {
                return unescape(y);
            }
        }
    }

    function setCurrentTime() {      
        var myTime = getCurrentTime();
        var myDate = getCurrentDateLabel();
        var myDate2 = getCurrentDate();
        var myWkDay = getCurrentWeekday();
        $('#lblCurrentTime').html(myTime);
        $('#lblCurrentDate').html(myDate);
        $('#lblCurrentTime2').html(myTime);
        $('#lblCurrentDate2').html(myDate2);
        $('#lblCurrentWeekDay').html(myWkDay);
    }

    function switchLogoImg() {
        var busLogo = $('#goBusLogo');
        var trainLogo = $('#goTrainLogo');

        if (currentImg == 'bus') {
            currentImg = "train";
            busLogo.hide();
            trainLogo.show();
        }
        else {
            currentImg = "bus";
            busLogo.show();
            trainLogo.hide();
        }
    }

    
    
</script>
